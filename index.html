:root{--bg:#14110e;--panel:#1b1611;--line:#2f281f;--txt:#D9D2C2;--dim:#7d745f;--key:#E4DBC6;--ink:#17130e;--red:#D70000}
body{min-height:100svh;background:var(--bg);color:var(--txt);font-family:'Space Mono','Courier New',monospace;
 display:flex;align-items:center;justify-content:center;padding:26px 14px}
.wrap{width:min(1000px,100%)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:14px;border-bottom:1px solid #241e16;padding-bottom:12px}

.sq{width:11px;height:11px;background:var(--red);flex:none}
.bezel{margin-top:16px;background:#1e1913;border:1px solid #332b21;border-radius:18px;padding:18px;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.glass{position:relative;aspect-ratio:6/5;background:#000;border:8px solid #0d0a08;border-radius:12px;overflow:hidden;cursor:default}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.deck{margin-top:16px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.tape{width:336px;flex:none}
.tape text{font-family:'Space Mono',monospace}
.t1{font-size:9px;letter-spacing:.18em;font-weight:700;fill:#8a7f66}
.t2{font-size:24px;font-weight:700;fill:#221c12}
.t3{font-size:8.5px;letter-spacing:.14em;fill:#4a4232}
.t4{font-size:9px;letter-spacing:.2em;font-weight:700;fill:#a33c2c}
.panel{flex:1;min-width:280px;display:flex;flex-direction:column;gap:12px}
.lab{font-size:9px;font-weight:700;letter-spacing:.26em;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.digits{display:flex;gap:5px;margin-top:6px}
.digits span{width:27px;height:34px;line-height:34px;text-align:center;background:#0c0a07;border-radius:4px;
 font-size:21px;font-weight:700;color:var(--key);box-shadow:inset 0 2px 5px rgba(0,0,0,.9)}
.motor{display:flex;flex-direction:column;align-items:center;gap:6px}
#motor{width:10px;height:10px;border-radius:50%;background:#3a3129;transition:.15s}
#motor.on{background:var(--red);box-shadow:0 0 8px 1px rgba(215,0,0,.65)}
.keys{display:flex;gap:9px}
.keys button{flex:1;padding:12px 0;border:none;border-radius:6px;background:var(--key);color:var(--ink);
 font:700 13px 'Space Mono',monospace;letter-spacing:.16em;box-shadow:0 3px 0 #060504;cursor:pointer}
.keys button.held{transform:none;box-shadow:none;background:#d5ccb4;filter:brightness(1.06)}
.keys button .lbl{display:inline-block}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.spd{display:flex;gap:6px;align-items:center}
.spd button{padding:5px 10px;border:1px solid #3a3125;background:none;color:var(--dim);font:700 10px 'Space Mono',monospace;border-radius:4px;cursor:pointer}
.spd button.on{background:var(--red);border-color:var(--red);color:#fff}
#phaseLab{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--txt)}
.vrow{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:#3a3125;border-radius:2px;cursor:pointer;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--key)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--key);border:none}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;margin-top:16px;border-top:1px solid #241e16;font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--dim)}

.hwbtn{position:absolute;left:4px;top:calc(14px + (100% - 14px - 6px)/2);transform:translateY(-50%);
 background:#2a231a;border:1px solid #443a2c;border-bottom-width:3px;border-radius:5px;
 height:30px;box-sizing:border-box;padding:6px 16px;cursor:pointer;flex:none;color:#b7ab8f;font:700 9px 'Space Mono',monospace;letter-spacing:.24em}
.hwbtn:active{filter:brightness(1.35);color:#e4dbc6}

.glassWrap{flex:1;min-width:0}
.grille{width:72px;flex:none;border-radius:8px;border:1px solid #31281e;
 background:radial-gradient(circle at 4px 4px,#0a0806 1.6px,transparent 1.9px) 0 0/9px 9px,#211a13;
 display:flex;justify-content:center;align-items:flex-start;padding-top:8px}
.vtc{flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
@media (max-width:700px){.grille{display:none}.tvbar{padding-right:4px}}
.bezel{background:#1e1913;border:1px solid #332b21;border-radius:18px;padding:18px;box-shadow:0 30px 60px -30px rgba(0,0,0,.8);display:flex;flex-direction:column;justify-content:flex-start}
.bezelInner{display:flex;gap:16px;align-items:stretch}

.tvbar{position:relative;display:flex;justify-content:center;align-items:center;padding:20px 4px 6px 4px}
.tvbrand{width:calc(100% - 70px);display:flex;justify-content:center;align-items:center;
 font:700 11px 'Space Mono',monospace;letter-spacing:.14em;color:#6b6250;line-height:1;
 min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis; 
 font:700 11px 'Space Mono',monospace;letter-spacing:.18em;line-height:1;text-align:center;
 color:#3a352b;
 text-shadow:0 -1px 1px rgba(0,0,0,1),0 1px 1px rgba(255,250,230,.3)}
 
.tvled{display:flex;align-items:center;gap:8px;font:700 8.5px 'Space Mono',monospace;letter-spacing:.3em;line-height:1;
 color:#3a352b;text-shadow:0 -1px 1px rgba(0,0,0,.9),0 1px 1px rgba(255,250,230,.25)}
.led{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 6px 1px rgba(215,0,0,.5)}

/* ---- Speccy palette quantizer (8 colours + BRIGHT) ---- */
const N5=[[0,0,0],[0,0,205],[205,0,0],[205,0,205],[0,205,0],[0,205,205],[205,205,0],[205,205,205]];
const B5=[[0,0,0],[0,0,255],[255,0,0],[255,0,255],[0,255,0],[0,255,255],[255,255,0],[255,255,255]];
function best2(c){const out=[];

  for(let q=0;q<8;q++){const t=P[q],dd=(c[0]-t[0])**2+(c[1]-t[1])**2+(c[2]-t[2])**2;
   if(dd<bd){bd=dd;bq=q;}}

const WARM_INK=[36,30,20],HDR_INK=[244,238,222],HDR_PAP=[0,0,208];

function buildArt(){

 const hdr=new Array(40).fill(false),rol=new Array(40).fill(false);
 for(let i=0;i<Math.min(L.length,40);i++){hdr[i]=!!L[i].h;rol[i]=!!L[i].r;}

  const cy=(i/RC)|0,cx=i%RC;let a,ink,pap;

  const ln=L[i];if(!ln.t)continue;let x=8;
  for(const ch of ln.t){
   const g=FONT[ch];
   if(g)for(let r=0;r<8;r++){const b=g[r];if(!b)continue;
    for(let c=0;c<8;c++)if(b&(0x80>>c)){
     const xx=x+c,y=i*8+r;art[y*RC+(xx>>3)]|=0x80>>(xx&7);}}

function mergePhoto(){
 if(!pDat)return;

  const L=new Float32Array(64),C=[];let sum=0;
  for(let sy=0;sy<8;sy++)for(let sx=0;sx<8;sx++){
   const i=((cy*8+sy)*96+cx*8+sx)*4,l=.299*d[i]+.587*d[i+1]+.114*d[i+2];
   L[sy*8+sx]=l;C.push([d[i],d[i+1],d[i+2]]);sum+=l;}
  const thr=sum/64;
  let dr=0,dg=0,db=0,nc=0,lr=0,lg=0,lb=0,mc=0;
  for(let k=0;k<64;k++){const c=C[k];
   if(L[k]<thr){dr+=c[0];dg+=c[1];db+=c[2];nc++;}else{lr+=c[0];lg+=c[1];lb+=c[2];mc++;}}
  if(!nc){dr=dg=db=0;nc=1;}if(!mc){lr=lg=lb=255;mc=1;}
  const bi=best2([dr/nc,dg/nc,db/nc]),bp=best2([lr/mc,lg/mc,lb/mc]);
  let br,iq,pq;
  if(bi[0][1]+bp[0][1]<=bi[1][1]+bp[1][1]){br=0;iq=bi[0][0];pq=bp[0][0];}
  else{br=1;iq=bi[1][0];pq=bp[1][0];}

  if(lum(pap)>=165)pap=PAP_COL.slice();          /* светлые бумаги (вкл. голубые) → бумага резюме */
  if(lum(ink)>lum(pap)-50)ink=pap.map(dk);       /* светлая «тень» → тёмная: ничего не затирается */
  inkC[gi]=ink;papC[gi]=pap;
  const cut=(lum(ink)+lum(pap))/2;
  for(let sy=0;sy<8;sy++)for(let sx=0;sx<8;sx++){

}

function clunk(){if(!A.ctx)return;const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();
 o.type='sine';o.frequency.setValueAtTime(120,t);
 o.frequency.exponentialRampToValueAtTime(45,t+.09);
 g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
 o.connect(g);g.connect(A.master);o.start(t);o.stop(t+.14);}

/* ---- streaming tape engine (signal identical to V12) ---- */
const EM={ph:'idle',segIx:0,level:1,color:0,pilotLeft:0,pauseLeft:0,
 byteIx:0,bitIx:0,halfs:0,halfLen:0,halfLeft:0,curByte:0,syncPh:0,
 sil:false,rewLeft:0,rewTotal:1,restartAt:0};
const events=[];let c0=0;
const paintQ=[];
let uiState='stop',prevWasPlay=false,coverDirty=true;
let romReading=false,cvLoaded=false,target='CV';
let snap=null,snapRate=1; let rewFromPos=0; 
let readSync=0; let motorRunning=false;
let hdrAccepted=false;

let tapeCounter=0,tapeUsed=0,lastColor=0;
const phaseLab=document.getElementById('phaseLab');
const setLabel=s=>{if(phaseLab.textContent!==s)phaseLab.textContent=s;};

let SEGS=[];
function buildSegs(){
 SEGS=[
  {k:'pilot',d:1.8},
  {k:'block',off:0,len:19,lab:'HEADER',prog:'CV'},
  {k:'pause',d:.7},
  {k:'pilot',d:1.4},
  {k:'block',off:19,len:302,lab:'LOADER'},
  {k:'pause',d:1.8},
  {k:'pilot',d:3.2},
  {k:'block',off:321,len:TOTAL+2,lab:'SCREEN$',prog:'CV'},
  {k:'pause',d:10},                                /* окно «не успел нажать STOP» */
  {k:'pilot',d:2.2},
  {k:'block',off:OFF.kHdr,len:19,lab:'HEADER',prog:'KLOTZ'},
  {k:'pause',d:.9},
  {k:'pilot',d:1.6},
  {k:'block',off:OFF.kLoad,len:302,lab:'LOADER'},
  {k:'pause',d:1.4},
  {k:'pilot',d:2.6},
  {k:'block',off:OFF.kScr,len:TOTAL+2,lab:'SCREEN$',prog:'KLOTZ'},
  {k:'pause',d:1.0},
  {k:'pilot',d:1.8},
  {k:'block',off:OFF.kCode,len:2402,lab:'CODE'},
  {k:'pause',d:.8},
  {k:'end'}];
}

function romHears(seg){          /* слышит ли ROM этот сегмент ленты */
 if(seg===undefined)return true;                /* REW и служебные — рамка живёт всегда */
 if(!romReading)return false;
 if(seg<readSync)return false;
 const s=SEGS[seg];
 if(!s)return false;
 if(s.k!=='block'){                             /* пилот/пауза принадлежат следующему блоку */
  let j=seg+1;
  while(j<SEGS.length&&SEGS[j]&&SEGS[j].k!=='block')j++;
  const nb=SEGS[j];
  if(!nb)return false;
  const prog=nb.off>=OFF.kHdr?'KLOTZ':'CV';
  return hdrAccepted&&prog===target;            /* пилот своей программы — строб, иначе дыхание */
 }
 const prog=s.off>=OFF.kHdr?'KLOTZ':'CV';
 if(s.lab==='HEADER')return prog===target||!target; /* свой заголовок; при LOAD "" — первый */
 return hdrAccepted&&prog===target;             /* данные — только после принятого заголовка */
}

function applySeg(tNow){
 const s=SEGS[EM.segIx];
 if(!s||s.k==='end'){endTape(tNow);return;}
 EM.ph=s.k;
 const sr=A.ctx.sampleRate,ts=1/rate;
 paintQ.push({t:tNow,lab:s.k==='pilot'?'PILOT':s.k==='pause'?'GAP':s.lab,seg:EM.segIx});
 if(s.k==='pilot'){EM.pilotLeft=s.d*ts*sr;return;}
 if(s.k==='pause'){EM.pauseLeft=s.d*ts*sr;return;}
 EM.bitIx=0;EM.byteIx=0;EM.halfs=0;EM.halfLeft=0;EM.syncPh=1;
 EM.curByte=TB[s.off];
}

function advanceByte(tNow){
 const s=SEGS[EM.segIx];
 EM.byteIx++;
 paintQ.push({t:tNow,gi:s.off+EM.byteIx-1,seg:EM.segIx});
 if(EM.byteIx>=s.len){
  if(s.lab==='HEADER')paintQ.push({t:tNow,act:'prog',nm:s.prog,seg:EM.segIx});
  if(s.lab==='SCREEN$'&&s.prog==='CV')paintQ.push({t:tNow,act:'cvDone',seg:EM.segIx});
  if(s.lab==='CODE')paintQ.push({t:tNow,act:'launch',seg:EM.segIx});
  EM.segIx++;applySeg(tNow);
 }else{
  EM.curByte=TB[s.off+EM.byteIx];
 }
}
function endTape(tNow){
 EM.ph='end';EM.sil=true;EM.restartAt=Infinity; /* глушим старый авто-перезапуск в seq.gen */
 paintQ.push({t:tNow+.01,lab:'END'});
}

function nextHalfLen(tNow){
 const sr=A.ctx.sampleRate,ts=1/rate;
 for(;;){
  if(EM.ph==='pilot'){
   const len=Math.max(1,Math.round(PILOT*ts*sr));
   EM.pilotLeft-=len;
   if(EM.pilotLeft<=0){EM.segIx++;applySeg(tNow);continue;}
   return len;
  }
  if(EM.ph==='block'){
   if(EM.syncPh===1){EM.syncPh=2;return Math.max(1,Math.round(S1*ts*sr));}
   if(EM.syncPh===2){EM.syncPh=0;return Math.max(1,Math.round(S2*ts*sr));}
   if(EM.halfs===0){
    const bit=EM.bitIx===0?0:EM.bitIx<=8?(EM.curByte>>(EM.bitIx-1))&1:1;
    EM.halfLen=Math.max(1,Math.round((bit?B1:B0)*ts*sr));EM.halfs=2;
   }
   EM.halfs--;const len=EM.halfLen;
   if(EM.halfs===0){
    EM.bitIx++;
    if(EM.bitIx>=10){EM.bitIx=0;advanceByte(tNow);}
   }
   return len;
  }
  return 0;
 }
}


function resetRun(tNow){
 buildSegs();
 EM.segIx=0;EM.sil=false;EM.halfLeft=0;EM.syncPh=0;
 EM.level=1;EM.color=0;EM.ph='idle';
 events.length=0;paintQ.length=0;c0=0;
 tapeCounter=0;tapeUsed=0;
 resetPic();
 applySeg(tNow!==undefined?tNow:(A.ctx?A.ctx.currentTime:0));
}
const seq={on:false,schedUntil:0,tm:0,srcs:[],
 start(){if(this.on)return;this.on=true;
  this.schedUntil=A.ctx.currentTime+.08;this.loop();},

 loop(){
  if(!this.on)return;
  const look=document.hidden?10:1.4;    /* фон: 10с запаса — хватает при секундном троттлинге */
  while(this.on&&this.schedUntil<A.ctx.currentTime+look)this.gen();
  if(!this.on)return;
  this.tm=setTimeout(()=>this.loop(),200);
 },

 gen(){
  const sr=A.ctx.sampleRate,Nn=document.hidden?44100:4096;
  const buf=A.ctx.createBuffer(1,Nn,sr),d=buf.getChannelData(0);
  const t0c=this.schedUntil;let i=0;
  while(i<Nn){
	if(EM.ph==='fwd'){
     if(EM.halfLeft<=0){
      EM.level=-EM.level;EM.color^=1;
      
      events.push({t:t0c+i/sr,c:EM.color});	  
      const p=EM.rewLeft/EM.rewTotal;
      const env=.45+1.35*Math.sin(Math.PI*Math.min(p,.999));
      EM.halfLeft=Math.max(1,Math.round((1.4+Math.random()*3.2)/env*sr/1000));
      continue;
     }
     const n=Math.min(EM.halfLeft,Nn-i),s=EM.level*.42;
     for(let k=0;k<n;k++)d[i+k]=s;
     EM.halfLeft-=n;EM.rewLeft-=n;i+=n;
     if(EM.rewLeft<=0){finishFwd();break;}
     continue;
   }
  
   if(EM.ph==='rew'){
    if(EM.halfLeft<=0){
     EM.level=-EM.level;EM.color^=1;
     
     events.push({t:t0c+i/sr,c:EM.color});	 
     const p=1-EM.rewLeft/EM.rewTotal;
     const env=.45+1.35*Math.sin(Math.PI*Math.min(p,.999));
     EM.halfLeft=Math.max(1,Math.round((2.6+Math.random()*5.2)/env*sr/1000));
     continue;
    }
    const n=Math.min(EM.halfLeft,Nn-i),s=EM.level*.42;
    for(let k=0;k<n;k++)d[i+k]=s;
    EM.halfLeft-=n;EM.rewLeft-=n;i+=n;
    if(EM.rewLeft<=0){finishRew();break;}
    continue;
   }
   if(EM.sil){
    if(EM.ph==='end'&&t0c+i/sr>=EM.restartAt){resetRun(t0c+i/sr);continue;}
    if(EM.ph==='pause'){
     const n=Math.min(Math.ceil(EM.pauseLeft),Nn-i);
     for(let k=0;k<n;k++)d[i+k]=0;
     EM.pauseLeft-=n;i+=n;
     if(EM.pauseLeft<=0){EM.segIx++;applySeg(t0c+i/sr);
      if(EM.ph==='pilot'||EM.ph==='block')EM.sil=false;}
     continue;
    }
    for(let k=i;k<Nn;k++)d[k]=0;i=Nn;continue;
   }
   if(EM.halfLeft<=0){
    const len=nextHalfLen(t0c+i/sr);
    if(len===0){EM.sil=true;continue;}
    EM.level=-EM.level;EM.color^=1;    
    events.push({t:t0c+i/sr,c:EM.color,seg:EM.segIx,d:romHears(EM.segIx)&&(function(){const s=SEGS[EM.segIx];return s&&s.k==='block'&&s.lab!=='HEADER'&&hdrAccepted;})()});
    EM.halfLeft=len;
    continue;
   }
   const n=Math.min(EM.halfLeft,Nn-i),s=EM.level*.42;
   for(let k=0;k<n;k++)d[i+k]=s;
   EM.halfLeft-=n;i+=n;
  }
  if(i<Nn)for(let k=i;k<Nn;k++)d[k]=0;
  const src=A.ctx.createBufferSource();
  src.buffer=buf;src.connect(A.master);src.start(t0c);src._t=t0c;
  this.srcs.push(src);
  if(this.srcs.length>1000)this.srcs.splice(0,this.srcs.length-1000);

  if(document.hidden&&events.length>2000){
   /* фон: выбрасываем только устаревшие события; будущие (окно звучания) храним — они нужны рамке после возврата */
   let k=0;
   while(k<events.length&&events[k].t<A.ctx.currentTime-0.5)k++;
   if(k)events.splice(0,k);
  }  
  this.schedUntil+=Nn/sr;
 },
 halt(){this.on=false;clearTimeout(this.tm);
  for(const s of this.srcs){try{s.stop()}catch(e){}}this.srcs=[];}
};

/* ---- renderer: 50 Hz field-locked border + render-side drift ---- */
const cv=document.getElementById('scr'),g=cv.getContext('2d');
let dpr=1,cw=0,chh=0;
function size(){const r=cv.getBoundingClientRect();
 dpr=Math.min(devicePixelRatio||1,2);
 cv.width=Math.max(2,Math.round(r.width*dpr));
 cv.height=Math.max(2,Math.round(r.height*dpr));cw=r.width;chh=r.height;}
addEventListener('resize',size);addEventListener('load',size);size();
const NB=264,bc=document.createElement('canvas');bc.width=2;bc.height=NB;
const bg=bc.getContext('2d'),bi=bg.createImageData(2,NB),PR=new Float32Array(NB*3);
let lastField=-1;

function drawCRT(tNow){
 const fIx=Math.floor(tNow/FIELD);
 if(fIx!==lastField){
  lastField=fIx;
  const fs=fIx*FIELD;
  const drift=2.2e-3*Math.sin(tNow*2.51)+.6e-3*Math.sin(tNow*9.7);
  const keep=.32,mix=1-keep,d=bi.data;
  let ev=0,cur=c0,dmode=lastDmode;
  for(let j=0;j<NB;j++){
   const td=fs+(j+.5)*VIS/NB+drift;
   while(ev<events.length&&events[ev].t<=td){
    const e0=events[ev];
    if(romHears(e0.seg)){cur=e0.c;dmode=!!e0.d;}
    ev++;}
   const col=dmode?(cur===0?YEL:BLU):(cur===1?CYAN:cur===2?WHITE:RED),o=j*3;
   PR[o]+=(col[0]*.8-PR[o])*mix;
   PR[o+1]+=(col[1]*.8-PR[o+1])*mix;
   PR[o+2]+=(col[2]*.8-PR[o+2])*mix;
   const q=j*8;
   d[q]=Math.min(255,PR[o]);d[q+1]=Math.min(255,PR[o+1]);
   d[q+2]=Math.min(255,PR[o+2]);d[q+3]=255;
   d[q+4]=d[q];d[q+5]=d[q+1];d[q+6]=d[q+2];d[q+7]=255;
  }
  lastColor=cur;
  lastDmode=dmode;
  bg.putImageData(bi,0,0);
 }
 g.imageSmoothingEnabled=true;
 g.drawImage(bc,0,0,cw,chh);
}

function draw(t){
 g.setTransform(dpr,0,0,dpr,0,0);
 if(mode==='boot'){drawBootScreen(t);return;}
 if(picDirty){picCtx.putImageData(picData,0,0);picDirty=false;}
 const waiting=romReading&&!motorRunning&&uiState==='stop';
 if(waiting){
  drawCRT(t);                                  /* ROM слушает: белая пауза с медленным дыханием */
 }else{
  const wantFull=(uiState==='stop');
  if(wantFull&&coverDirty){
   renderFullColor();
   romPrint(uiState==='stop'?(cvLoaded?'0 OK, 0:1':'TAPE LOADER V13 - READY'):'0 OK, 0:1');
   coverDirty=false;
  }
  if(uiState==='stop'){g.fillStyle='#050403';g.fillRect(0,0,cw,chh);}
  else drawCRT(t);
 }
 const ex=Math.round(cw*.1),ey=Math.round(chh*.1),ew=Math.round(cw*.8),eh=Math.round(chh*.8);
 g.imageSmoothingEnabled=false;
 g.drawImage(picCan,ex,ey,ew,eh);
}

/* ---- deck controls ---- */
const motor=document.getElementById('motor'),
 dig=[...document.querySelectorAll('#digits span')],
 btnPlay=document.getElementById('btnPlay'),btnStop=document.getElementById('btnStop'),
 btnRew=document.getElementById('btnRew'),btnFwd=document.getElementById('btnFwd'),
 btnReset=document.getElementById('btnReset'),
 rl=document.getElementById('reelL'),rr=document.getElementById('reelR'),
 tapeL=document.getElementById('tapeL'),tapeR=document.getElementById('tapeR');
{const teeth=[...Array(6)].map((_,i)=>`<rect x="-2.4" y="-13" width="4.8" height="8" rx="2.4" transform="rotate(${i*60})"/>`).join('');
 const hub=`<circle r="13" fill="#D8CFB8"/><g fill="#241d15">${teeth}</g><circle r="3" fill="#241d15"/>`;
 rl.innerHTML=hub;rr.innerHTML=hub;}
function setState(s){
 uiState=s;document.body.dataset.state=s;
 btnPlay.classList.toggle('held',s==='play');
 btnRew.classList.toggle('held',s==='rew');
 btnFwd.classList.toggle('held',s==='fwd');
 motor.classList.toggle('on',s!=='stop');
 if(s==='stop')coverDirty=true;
 if(A.ctx&&A.hiss)A.hiss.gain.setTargetAtTime(s==='play'||s==='rew'||s==='fwd'?.05:0,A.ctx.currentTime,.06);
}

function startTape(tgt){
 if(Math.floor(tapeCounter)>=N){setLabel('REWIND FIRST');return;}
 if(uiState==='rew'){setLabel('REWIND');return;}
 endBoot();
 target=tgt;romReading=true;cvLoaded=false;hdrAccepted=false;
 readSync=0;
 if(uiState==='play'){                        /* лента играла: стоп-мотор, запомнить позицию */
  snap={...EM};snapRate=rate;
  seq.halt();
 }
 motorRunning=false;
 initAudio();A.ctx.resume();
 clunk();
 setState('stop');
 resetPic();
 romPrint('Press PLAY on tape');
 setLabel('WAIT PLAY');
}

function pressPlay(){
 if(uiState!=='stop')return;
 initAudio();A.ctx.resume();
 if(romReading&&!motorRunning){                /* ROM ждёт PLAY: старт чтения */
  if(Math.floor(tapeCounter)>=N){setLabel('REWIND FIRST');return;}
  motorRunning=true;clunk();
  const t0=A.ctx.currentTime+.08;
  if(tapeCounter>0&&snap){                     /* продолжить с физической позиции ленты */
   Object.assign(EM,snap);
   if(snapRate!==rate){
    const k=snapRate/rate;
    EM.pilotLeft=Math.round(EM.pilotLeft*k);
    EM.pauseLeft=Math.round(EM.pauseLeft*k);
    EM.halfLeft=Math.max(1,Math.round(EM.halfLeft*k));
    EM.halfLen=Math.max(1,Math.round(EM.halfLen*k));
   }
  }else resetRun(t0);
  events.length=0;paintQ.length=0;c0=0;
  seq.start();setState('play');
  setLabel('PILOT');
  return;
 }
 clunk();
 const pos=Math.floor(tapeCounter);
 if(pos>=N){setLabel('REWIND FIRST');return;}
 const t0=A.ctx.currentTime+.08;
 if(pos>0&&snap){
  Object.assign(EM,snap);
  if(snapRate!==rate){
   const k=snapRate/rate;
   EM.pilotLeft=Math.round(EM.pilotLeft*k);
   EM.pauseLeft=Math.round(EM.pauseLeft*k);
   EM.halfLeft=Math.max(1,Math.round(EM.halfLeft*k));
   EM.halfLen=Math.max(1,Math.round(EM.halfLen*k));
  }
 }else{
  const keepC=tapeCounter,keepU=tapeUsed;
  resetRun(t0);
  if(pos>0){tapeCounter=keepC;tapeUsed=keepU;}
 }
 romReading=false;
 events.length=0;paintQ.length=0;c0=0;
 seq.start();setState('play');
}

function pressStop(){
 if(uiState==='stop')return;
 if(EM.ph==='rew'||EM.ph==='fwd'){
  seq.halt();events.length=0;paintQ.length=0;
  motorRunning=false;clunk();
  const p=Math.floor(tapeCounter);
  if(p>0){armAfterPos(p);snap={...EM};snapRate=rate;}else snap=null;
  lastDmode=false;           /* дыхание после STOP — снова К-Г */
  if(romReading)setLabel('WAIT PLAY');
  setState('stop');return;
 }
 snap={...EM};snapRate=rate;
 seq.halt();clunk();
 events.length=0;paintQ.length=0;
 motorRunning=false;
 lastDmode=false;  
 if(romReading){                 /* STOP посреди загрузки: ROM продолжает слушать */
  setState('stop');setLabel('WAIT PLAY');return;
 }
 setState('stop');
}

function toPrompt(){
 setState('stop');
 mode='boot';bootInp='';bootErrT=0;cpyDone=true;bootDirty=true;
 romReading=false;cvLoaded=false;lastDmode=false;
}

function breakLoad(){                 /* BREAK (Shift+Space) или Escape: выйти из LOAD */
 seq.halt();
 snap={...EM};snapRate=rate;          /* лента остаётся на физической позиции */
 toPrompt();
 bootMsg='D BREAK - CONT repeats';bootErrT=1;bootDirty=true;
 setTimeout(()=>{bootErrT=0;bootDirty=true;},2600);
}

function pressRew(){
 if(uiState==='rew')return;
 if(Math.floor(tapeCounter)<=0){setLabel('TAPE AT START');return;}
 initAudio();A.ctx.resume();
 prevWasPlay=(uiState==='play');
 rewFromPos=Math.floor(tapeCounter);          /* откуда поехали назад */
 if(prevWasPlay){
  const cut=A.ctx.currentTime+.06;
  for(const s of seq.srcs)if(s._t>cut){try{s.stop()}catch(err){}}
  seq.srcs=seq.srcs.filter(s=>s._t<=cut);
  seq.schedUntil=cut;
 }
 paintQ.length=0;
 clunk();setLabel('REWIND');
 EM.ph='rew';EM.sil=false;EM.halfLeft=0;
 EM.rewTotal=(1.8+Math.random()*.8)*A.ctx.sampleRate;
 EM.rewLeft=EM.rewTotal;
 motorRunning=false;
 setState('rew');
 if(!seq.on)seq.start();
}

function finishRew(){
 if(mode==='boot'){seq.halt();setState('stop');return;}
 if(prevWasPlay){
  if(romReading){
   seq.halt();
   motorRunning=false;
   makeRewSnap();
   setState('stop');
   setLabel('WAIT PLAY');
  }else{
   makeRewSnap();
   resetRun(seq.schedUntil);cvLoaded=false;setState('play');
  }
 }else{
  seq.halt();
  makeRewSnap();
  if(romReading){
   resetPic();romPrint('Press PLAY on tape');setLabel('WAIT PLAY');
  }
  setState('stop');
 }
}
function makeRewSnap(){                    /* где физически лента после отмотки */
 const landed=Math.max(0,Math.round(rewFromPos*(EM.rewLeft/EM.rewTotal)));
 if(landed>0){                              /* не доехали до нуля: снап на середине тишины */
  buildSegs();
  EM.segIx=SEGS.length-1;                   /* сегмент 'end' — движок молчит */
  EM.ph='end';EM.sil=true;EM.restartAt=Infinity;
  EM.halfLeft=0;EM.syncPh=0;EM.halfs=0;EM.halfLen=0;EM.bitIx=0;EM.byteIx=0;
  EM.level=1;EM.color=0;EM.pauseLeft=0;EM.pilotLeft=0;
  snap={...EM};snapRate=rate;
  tapeCounter=landed;tapeUsed=landed/N;
 }else{                                     /* доехали до самого начала */
  snap=null;
  tapeCounter=0;tapeUsed=0;
 }
}

function armAfterPos(pos){            /* поставить движок в позицию плёнки pos (в байтах) */
 buildSegs();
 for(let i=0;i<SEGS.length;i++){
  const s=SEGS[i];
  if(s.k==='block'&&pos>=s.off&&pos<s.off+s.len){
   EM.segIx=i;EM.ph='block';EM.sil=false;EM.syncPh=0;EM.halfs=0;EM.halfLen=0;EM.halfLeft=0;
   EM.bitIx=0;EM.byteIx=pos-s.off;EM.curByte=TB[pos];
   EM.level=1;EM.color=0;EM.pauseLeft=0;EM.pilotLeft=0;
   return;
  }
 }
 for(let i=0;i<SEGS.length;i++){
  const s=SEGS[i];
  if(s.k!=='pilot')continue;
  let j=i+1;while(j<SEGS.length&&SEGS[j].k!=='block')j++;
  const b=SEGS[j];
  if(b&&b.off>pos){
   EM.segIx=i;EM.ph='pilot';EM.sil=false;EM.syncPh=0;EM.halfs=0;EM.halfLen=0;EM.halfLeft=0;
   EM.bitIx=0;EM.byteIx=0;EM.level=1;EM.color=0;EM.pauseLeft=0;
   const sr=A.ctx?A.ctx.sampleRate:44100;
   EM.pilotLeft=Math.max(1,Math.round(s.d*sr/rate));
   return;
  }
 }
 EM.segIx=SEGS.length-1;EM.ph='end';EM.sil=true;EM.restartAt=Infinity;
 EM.halfLeft=0;EM.syncPh=0;EM.halfs=0;EM.halfLen=0;EM.bitIx=0;EM.byteIx=0;
 EM.level=1;EM.color=0;EM.pauseLeft=0;EM.pilotLeft=0;
}

function findNextProgram(pos){      /* следующий пилот ЗАГРУЗЧИКА после pos (CV с нуля не считаем целью) */
 for(let i=0;i<SEGS.length;i++){
  const s=SEGS[i];
  if(s.k!=='pilot')continue;
  let j=i+1;while(j<SEGS.length&&SEGS[j].k!=='block')j++;
  const b=SEGS[j];
  if(b&&b.lab==='HEADER'&&b.off>pos&&!(pos===0&&b.off<321))return{pix:i,off:b.off};
 }
 return null;}
function armAtPilot(pix){                        /* поставить движок на пилот без paintQ-событий */
 buildSegs();
 EM.segIx=pix;
 const s=SEGS[pix],sr=A.ctx.sampleRate,ts=1/rate;
 EM.ph='pilot';EM.sil=false;EM.syncPh=0;EM.halfs=0;EM.halfLen=0;EM.halfLeft=0;
 EM.bitIx=0;EM.byteIx=0;EM.level=1;EM.color=0;EM.pauseLeft=0;
 EM.pilotLeft=Math.max(1,Math.round(s.d*ts*sr));}
let fwdTargetIx=0;
function pressFwd(){
 if(uiState==='fwd')return;
 if(Math.floor(tapeCounter)>=N){setLabel('TAPE AT END');return;}
 if(!SEGS.length)buildSegs();      /* карта ленты ещё не строилась (нажали FWD сразу после включения) */
 initAudio();A.ctx.resume();
 const tgt=findNextProgram(Math.floor(tapeCounter));
 if(!tgt){setLabel('TAPE AT END');return;}
 setLabel(Math.floor(tapeCounter)===0?'FWD TO KLOTZ':'FWD');
 prevWasPlay=(uiState==='play');
 if(prevWasPlay){
  const cut=A.ctx.currentTime+.06;
  for(const s of seq.srcs)if(s._t>cut){try{s.stop()}catch(e){}}
  seq.srcs=seq.srcs.filter(s=>s._t<=cut);
  seq.schedUntil=cut;
 }
 paintQ.length=0;
 clunk();
 fwdTargetIx=tgt.pix;
 const dist=Math.max(1,tgt.off-Math.floor(tapeCounter));
 EM.ph='fwd';EM.sil=false;EM.halfLeft=0;
 EM.rewTotal=(dist/6000)*A.ctx.sampleRate;
 EM.rewLeft=EM.rewTotal;
 motorRunning=true;
 setState('fwd');
 if(!seq.on)seq.start();
}
function finishFwd(){
 seq.halt();
 armAtPilot(fwdTargetIx);
 snap={...EM};snapRate=rate;                     /* PLAY продолжит ровно с этого пилота */
 motorRunning=false;
 setState('stop');
 if(romReading){
  hdrAccepted=false;                             /* синхронизация потеряна — ROM ждёт PLAY */
  romPrint('Press PLAY on tape');setLabel('WAIT PLAY');
 }else setLabel('READY');
}
function pressReset(){
 if(A.ctx)clunk();
 seq.halt();
 motorRunning=false;romReading=false;cvLoaded=false;hdrAccepted=false;lastDmode=false;
 target='CV';readSync=0;snap=null;
 events.length=0;paintQ.length=0;c0=0;
 tapeCounter=0;tapeUsed=0;
 buildSegs();
 EM.ph='idle';EM.sil=true;EM.halfLeft=0;EM.syncPh=0;EM.level=1;EM.color=0;
 mode='boot';bootInp='';bootErrT=0;cpyDone=false;bootDirty=true;
 lastCpy=null;lastBlink=false; bootMsg='';
             /* полный «прогрев»: чёрное поле → © → курсор */
 BOOT0=performance.now()/1000-(1.0-0.72);  /* после эффекта — сразу фаза ©, без лишнего чёрного */
 resetFxUntil=performance.now()/1000+0.72; /* эффект красных линий ресета, 0.72 сек */ 
 setState('stop');
}

btnPlay.addEventListener('click',()=>{pressPlay();btnPlay.blur();});
btnStop.addEventListener('click',()=>{pressStop();btnStop.blur();});
btnRew.addEventListener('click',()=>{pressRew();btnRew.blur();});

btnFwd.addEventListener('click',()=>{pressFwd();btnFwd.blur();});
btnReset.addEventListener('click',()=>{pressReset();btnReset.blur();});

addEventListener('keydown',e=>{if(e.repeat)return;
 if(mode==='boot'){handleBootKey(e);return;}
 if(romReading&&(e.key==='Escape'||(e.code==='Space'&&e.shiftKey))){
  e.preventDefault();breakLoad();return;}
 if(e.code==='Space'){e.preventDefault();uiState==='stop'?pressPlay():pressStop();}
 if(e.key==='r'||e.key==='R')pressRew();
 if(e.key==='f'||e.key==='F')pressFwd();});
document.getElementById('vol').addEventListener('input',e=>{
 vol=e.target.value/100;
 if(A.master)A.master.gain.setTargetAtTime(.55*vol,A.ctx.currentTime,.02);});

const sp1=document.getElementById('sp1'),sp4=document.getElementById('sp4');
function setRate(r){rate=r;
 sp1.classList.toggle('on',r===1);sp4.classList.toggle('on',r===4);}
sp1.addEventListener('click',()=>setRate(1));
sp4.addEventListener('click',()=>setRate(4));

/* ---- main loop: paint bytes exactly when they are AUDIBLE ---- */
let aL=0,aR=0,shownC=-1,last=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min((now-last)/1000,.05);
 const awayGap=Math.max(0,(now-last)/1000-dt);   /* сколько секунд кадров не было */
 last=now;
 const t=A.ctx?A.ctx.currentTime:now/1000;
 
 let heardEv=false,cut=0;
 while(cut<events.length&&events[cut].t<t-.3){
  const e0=events[cut];
  if(romHears(e0.seg)){c0=e0.c;heardEv=true;lastDmode=!!e0.d;}
  cut++;
 }
 if(cut)events.splice(0,cut);
 if(!heardEv)lastDmode=false;    /* нет свежих событий: поиск/дыхание — всегда К-Г */
 if(romReading&&!heardEv&&(!hdrAccepted||uiState==='stop'))  /* ищем заголовок: красно-голубое дыхание */
  c0=(Math.floor(t/1.2)%2===0)?0:1;

 {
  let pend=0;
  while(pend<paintQ.length&&paintQ[pend].t<=t)pend++;
  const take=Math.min(pend,4000);
  for(let ix=0;ix<take;ix++){
  const e=paintQ[ix];

  if(e.gi!==undefined){
   const k=TK[e.gi];
   if(romHears(e.seg)){
    if(k===1&&target==='CV'){const p=TP[e.gi];
     if(p<PKN){revealBM(p);setLabel('SCREEN$ '+Math.min(99,Math.round(p/153.6))+'%');}
     else{revealAttr(p-PKN);setLabel('COLOUR '+Math.min(99,Math.round((p-PKN)/19.2))+'%');}
     picDirty=true;}
    else if(k===3&&target==='KLOTZ'){const p=TP[e.gi];
     if(p<PKN){revealKB(p);setLabel('SCREEN$ '+Math.min(99,Math.round(p/153.6))+'%');}
     else{revealKA(p-PKN);setLabel('COLOUR '+Math.min(99,Math.round((p-PKN)/19.2))+'%');}
     picDirty=true;}
   }
  }else if(e.lab){
   setLabel(e.lab);
   if(e.lab==='LOADER'&&romHears(e.seg))romPrint('Bytes: '+(target||''));
  }
  else if(e.act==='prog'){
   if(romHears(e.seg)){
    if(!target)target=e.nm;
    if(e.nm===target){hdrAccepted=true;romPrint('Program: '+e.nm);}
   }
  }
  else if(e.act==='cvDone'){if(romHears(e.seg)&&target==='CV'){
   cvLoaded=true;romReading=false;romPrint('0 OK, 0:1');setLabel('LOADED');}}
  else if(e.act==='launch'){if(romHears(e.seg)){
   romPrint('0 OK, 0:1');setLabel('LOADED');
   setTimeout(()=>{location.href='klotz.html';},1200);}}
  }
  if(take)paintQ.splice(0,take);
 }
 
 if(!TAPE_TIME&&SEGS.length)computeTapeTime();
 if(uiState==='play'){
  if(awayGap>0.5)tapeCounter=Math.min(N,tapeCounter+awayGap*N*rate/TAPE_TIME);
  else tapeCounter=Math.min(N,tapeCounter+dt*N*rate/TAPE_TIME);
 }
 if(uiState==='rew')tapeCounter=Math.max(0,tapeCounter-dt*6000);
 if(uiState==='fwd')tapeCounter=Math.min(N,tapeCounter+dt*6000);
 tapeUsed=Math.min(1,Math.max(0,tapeCounter/N));
 
 
 const shown=Math.floor(Math.min(1,tapeCounter/N)*9999);
 if(shown!==shownC){shownC=shown;
  const s=String(shown).padStart(4,'0');
  for(let i=0;i<4;i++)if(dig[i].textContent!==s[i])dig[i].textContent=s[i];}
  
 if(uiState==='play'){aL-=dt*130*rate;aR-=dt*240*rate;}
 else if(uiState==='rew'){aL+=dt*700;aR+=dt*700;}
 else if(uiState==='fwd'){aL-=dt*700;aR-=dt*700;}
 rl.setAttribute('transform',`rotate(${aL})`);
 rr.setAttribute('transform',`rotate(${aR})`);
 tapeL.setAttribute('r',(15+(1-tapeUsed)*11).toFixed(1));
 tapeR.setAttribute('r',(15+tapeUsed*11).toFixed(1));

 draw(t);
}

/* ---- boot: render loop first, then async photo + external text ---- */

/* ================= POWER-ON BOOT (v13.5) =================
   t<0.75 — экран выключен; t<0.9 — вспышка включения;
   далее — белый экран ROM: (c) 1981 внизу, строка ввода с мигающим курсором.
   LOAD "" + Enter -> стартует загрузка (вся отлаженная механика без изменений). */
let mode='boot',bootInp='',bootErrT=0,bootDirty=true, resetFxUntil=0,
lastBlink=false,lastCpy=null,cpyDone=false,bootMsg='';
let BOOT0=performance.now()/1000;
const bootTime=()=>performance.now()/1000-BOOT0;
const bootCan=document.createElement('canvas');bootCan.width=SW;bootCan.height=SH;
const bg2=bootCan.getContext('2d');
function bglyph(ch,cx,cy,inv){
 const G=FONT[ch];if(!G)return;
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const on=!!(G[r]&(0x80>>c));
  if(on){bg2.fillStyle=inv?'#ffffff':'#000000';bg2.fillRect(cx*8+c,cy*8+r,1,1);}
  else if(inv){bg2.fillStyle='#000000';bg2.fillRect(cx*8+c,cy*8+r,1,1);}
 }
}
function btext(s,cx,cy,inv){for(let i=0;i<s.length;i++)bglyph(s[i],cx+i,cy,inv);}

const CPY='© 1982 Sinclair Research Ltd',CPY_ROW=39,INP_ROW=38;

function renderBoot(cpyOn,cursorOn){
 bg2.fillStyle='#f5f3ec';bg2.fillRect(0,0,SW,SH);
 if(cpyOn)btext(CPY,(48-CPY.length)>>1,CPY_ROW);
 else if(bootErrT)btext(bootMsg||'C Nonsense in BASIC',1,INP_ROW);
 else{
  btext(bootInp,1,INP_ROW,false);
  if(cursorOn)btext(bootInp.length?'L':'K',1+bootInp.length,INP_ROW,true);
 }
}

function drawResetFx(p){        /* p: 0→1; линии → точки съедают сверху → точки гаснут */
 const ex=Math.round(cw*.1),ey=Math.round(chh*.1),ew=Math.round(cw*.8),eh=Math.round(chh*.8);
 g.fillStyle='#f5f3ec';g.fillRect(0,0,cw,chh);
 g.fillStyle='#060606';g.fillRect(ex,ey,ew,eh);
 g.save();g.beginPath();g.rect(ex+2,ey+2,ew-4,eh-4);g.clip();
 const flick=0.75+0.25*Math.sin(p*40);            /* лёгкое дрожание яркости, как у развёртки */
 if(p<0.45){                                       /* фаза 1: красные линии по всему полю */
  g.fillStyle=`rgba(205,30,20,${(0.85-0.25*p/0.45)*flick})`;
  for(let x=ex+3;x<ex+ew-3;x+=9)g.fillRect(x,ey+2,2.5,eh-4);
  if(p>0.2){                                       /* точки съедают линии сверху вниз */
   const bd=ey+eh*Math.min(1,(p-0.2)/0.6);
   g.fillStyle='#060606';g.fillRect(ex,ey,ew,bd-ey);
   g.fillStyle=`rgba(185,25,18,${0.8*Math.min(1,(p-0.2)*3)})`;
   for(let y=ey+5;y<bd-4;y+=13)for(let x=ex+5;x<ex+ew-5;x+=16)g.fillRect(x,y,3,3);
  }
 } else {                                          /* фаза 2: остатки точек гаснут сверху вниз */
  g.fillStyle=`rgba(185,25,18,${Math.max(0,0.8-(p-0.45)*1.6)})`;
  const top=ey+eh*Math.min(1,(p-0.45)/0.55);
  for(let y=ey+5+Math.floor(top-ey-5);y<ey+eh-5;y+=13)
   for(let x=ex+5;x<ex+ew-5;x+=16)g.fillRect(x,y,3,3);
 }
 g.restore();
}

const BOOT_BLACK=1.0,CPY_HOLD=1.7;   /* чёрное поле 1 c, затем © висит 1.7 c */
function drawBootScreen(t){
 t=bootTime();
 const nowS=performance.now()/1000;
 if(nowS<resetFxUntil){drawResetFx(1-(resetFxUntil-nowS)/0.72);return;} 
 g.fillStyle='#f5f3ec';g.fillRect(0,0,cw,chh);
 const ex=Math.round(cw*.1),ey=Math.round(chh*.1),ew=Math.round(cw*.8),eh=Math.round(chh*.8);
 if(t<BOOT_BLACK){g.fillStyle='#0a0a0a';g.fillRect(ex,ey,ew,eh);return;}
 const cpy=!cpyDone&&t<BOOT_BLACK+CPY_HOLD;
 const blink=Math.floor(t/.33)%2===0;
 if(cpy!==lastCpy){lastCpy=cpy;bootDirty=true;}
 if(blink!==lastBlink){lastBlink=blink;bootDirty=true;}
 if(bootDirty){renderBoot(cpy,blink);bootDirty=false;}
 g.imageSmoothingEnabled=false;
 g.drawImage(bootCan,ex,ey,ew,eh);
}

function endBoot(){mode='classic';}
function typeBoot(ch){if(bootInp.length<44){bootInp+=ch;bootErrT=0;bootDirty=true;}}

function submitBoot(){
 const norm=bootInp.toUpperCase()
  .replace(/[\u201C\u201D\u2018\u2019]/g,'"').replace(/\s+/g,'');
 if(norm==='LOAD""'||norm==='LOAD"CV"'){startTape(norm==='LOAD"CV"'?'CV':null);return;}
 if(norm==='LOAD"KLOTZ"'){startTape('KLOTZ');return;}
 if(norm==='RANDOMIZEUSR4E4'||norm==='RANDOMIZEUSR40000'||norm==='RANDOMIZEUSR32768'){
  endBoot();                             /* выходим в «классический» режим */
  romReading=false;motorRunning=false;cvLoaded=true;coverDirty=true;
  setState('stop');
  setLabel('LOADED');
  return;
 } 
 if(bootInp.trim()){bootMsg='C Nonsense in BASIC'; bootErrT=1;setTimeout(()=>{bootErrT=0;bootDirty=true;},1500);}
 bootInp='';bootDirty=true;
}

function handleBootKey(e){
 cpyDone=true;bootDirty=true;
 const k=e.key;
 if(k==='Enter'){e.preventDefault();submitBoot();return;}
 if(k==='Backspace'){e.preventDefault();bootInp=bootInp.slice(0,-1);bootErrT=0;bootDirty=true;return;}
 if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
  e.preventDefault();
  let ch=k;
  if(!FONT[ch]){          /* глифа нет (русская раскладка и т.п.) — берём ФИЗИЧЕСКУЮ клавишу */
   const M={Minus:'-',Equal:'=',Comma:',',Period:'.',Slash:'/',Semicolon:';',Backquote:'`',
            BracketLeft:'[',BracketRight:']',Backslash:'\\',Space:' '};
   ch=/^Key[A-Z]$/.test(e.code)?e.code[3].toLowerCase()
     :/^Digit\d$/.test(e.code)?e.code[5]
     :e.code==='Quote'?(e.shiftKey?'"':"'")
     :(e.code==='Digit2'&&e.shiftKey)?'"'
     :(M[e.code]||'');
  }
  if(ch)typeBoot(ch);
  return;
 } 
}

resetPic();
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{
 if(seq.on)seq.loop();   /* ушли: сразу запас звука; вернулись: сразу генерация */
});

/* фото: base64 парсим вручную — чистим случайные пробелы/переносы,
   декодируем через Blob. Каждый шаг пишем в консоль. */
{
 const b64=window.CV_PHOTO_B64||'';
 if(!b64){console.warn('photo: data/cv_photo.js not loaded');}
 else{
  const bin=atob(b64.replace(/^data:image\/[a-z+]+;base64,/i,''));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));
  const im=new Image();
  im.onload=()=>{try{
   photoImg=im;rebuild();
   console.log('photo: loaded',im.width+'x'+im.height,'-> merged into SCREEN$ + tape');
  }catch(e){console.warn('photo merge failed:',e);}};
  im.onerror=()=>console.warn('photo: decode failed');
  im.src=url;
 }
}

try{fetch('data/cv_text_eng.txt').then(r=>r.ok?r.text():'').then(t=>{
  if(t&&t.trim()&&!t.trim().startsWith('<')){cvText=t;rebuild();}}).catch(()=>{});}catch(e){}
})();
</script>
